name: Build ServerControl IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build ServerControl for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project ServerControl.xcodeproj -scheme ServerControl -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/ServerControl.app
          test -f "$APP/ServerControl"
          plutil -lint "$APP/Info.plist"
          lipo -verify_arch arm64 "$APP/ServerControl"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ServerControl.ipa Payload
          unzip -t ServerControl.ipa
          shasum -a 256 ServerControl.ipa > ServerControl.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ServerControl-IPA
          path: |
            ServerControl.ipa
            ServerControl.ipa.sha256
          if-no-files-found: error
          retention-days: 30
