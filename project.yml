name: ServerControl

options:
  bundleIdPrefix: com.servercontrol
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ServerControl:
    type: application
    platform: iOS

    sources:
      - ServerControl

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servercontrol.app
        PRODUCT_NAME: ServerControl
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

    info:
      path: ServerControl/Info.plist
      properties:
        CFBundleDisplayName: Server Control
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
